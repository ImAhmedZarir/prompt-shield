services:
  prompt-shield:
    build: .
    container_name: prompt-shield
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPSTREAM_URL=https://api.openai.com
      - BLOCK_SECRETS=true
      - ANONYMIZE_PII=true
      - BLOCK_INJECTIONS=true
      - STRICT_MODE=false
    restart: unless-stopped
